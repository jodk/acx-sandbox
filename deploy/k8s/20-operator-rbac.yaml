# acx-operator (sandbox-controller) RBAC — service account + controller-role + leader election
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: acx-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller-role
  labels:
    app.kubernetes.io/name: acx-sandbox
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxes", "sandboxsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxes/finalizers", "sandboxsets/finalizers"]
    verbs: ["update"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxclaims/status", "sandboxes/status", "sandboxsets/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxclaims"]
    verbs: ["delete", "get", "list", "patch", "watch"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-rolebinding
  labels:
    app.kubernetes.io/name: acx-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controller-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: sandbox-system
---
# Namespace-scoped controller role: secrets access for sandbox pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-role
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: acx-sandbox
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-rolebinding
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: acx-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: acx-sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election-rolebinding
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: acx-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: sandbox-system

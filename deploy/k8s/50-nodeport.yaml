# 供浏览器访问管理前端/API 的 NodePort 入口
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager-nodeport
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox

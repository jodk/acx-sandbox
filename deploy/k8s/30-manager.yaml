# acx-manager (sandbox-manager) — REST/管理 API + 前端静态资源
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-manager
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-manager
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxes", "sandboxsets", "sandboxclaims", "sandboxtemplates"]
    verbs: ["get", "list", "watch", "update", "patch", "delete", "create"]
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxes/status", "sandboxsets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-manager
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-manager
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager-secrets
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["e2b-key-store"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager-secrets
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager-secrets
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: sandbox-system
---
apiVersion: v1
kind: Secret
metadata:
  name: e2b-key-store
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
type: Opaque
stringData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      component: sandbox-manager
      app.kubernetes.io/name: acx-sandbox
  template:
    metadata:
      labels:
        component: sandbox-manager
        app.kubernetes.io/name: acx-sandbox
    spec:
      serviceAccountName: sandbox-manager
      imagePullSecrets:
        - name: regcred
      # 固定调度到可访问 apiserver 的节点组（10.0.33.x 的 Pod 网络与控制面隔离）
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - 10.0.31.15
                      - 10.0.31.23
      containers:
        - name: manager
          image: image.ac.com:5000/acx/acx-sandbox-manager:latest
          imagePullPolicy: Always
          command:
            - java
            - -jar
            - /app/app.jar
          env:
            - name: SANDBOX_NAMESPACE
              value: "sandbox-system"
            - name: PEER_NAMESPACE
              value: "sandbox-system"
            - name: PEER_LABEL_SELECTOR
              value: "component=sandbox-manager"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    component: sandbox-manager
    app.kubernetes.io/name: acx-sandbox
